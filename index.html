<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multiplayer Room Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- JOIN SCREEN ---------- */
#join {
  padding: 20px;
}

#join input, #join button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

/* ---------- CHAT SCREEN ---------- */
#chat {
  display: none;
  height: 100vh;
  flex-direction: column;
}

/* HEADER */
#header {
  background: #222;
  color: white;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#header .info {
  font-size: 14px;
}

#leaveBtn {
  background: #ff4d4d;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}

/* MESSAGES */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.message {
  margin-bottom: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  max-width: 80%;
}

.me {
  background: #d1e7ff;
  margin-left: auto;
}

.other {
  background: #ffffff;
}

.system {
  text-align: center;
  font-size: 12px;
  color: gray;
}

/* INPUT */
#inputBar {
  display: flex;
  padding: 8px;
  background: #fff;
  border-top: 1px solid #ccc;
}

#msg {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

#sendBtn {
  padding: 10px 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- JOIN -->
<div id="join">
  <h2>Join Room</h2>
  <input id="username" placeholder="Username" />
  <input id="room" placeholder="Room ID" />
  <button onclick="joinRoom()">Join</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">
    <div class="info">
      Room: <b id="roomLabel"></b><br>
      You: <b id="userLabel"></b>
    </div>
    <button id="leaveBtn" onclick="leaveRoom()">Leave</button>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="msg" placeholder="Type message..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const socket = io("https://multiplayerwordgame.onrender.com");

let myUsername = "";
let myRoom = "";

function joinRoom() {
  myUsername = document.getElementById("username").value.trim();
  myRoom = document.getElementById("room").value.trim();
  if (!myUsername || !myRoom) return;

  socket.emit("join-room", { username: myUsername, roomId: myRoom });

  document.getElementById("roomLabel").innerText = myRoom;
  document.getElementById("userLabel").innerText = myUsername;

  document.getElementById("join").style.display = "none";
  document.getElementById("chat").style.display = "flex";
}

function sendMessage() {
  const input = document.getElementById("msg");
  if (!input.value) return;
  socket.emit("send-message", input.value);
  input.value = "";
}

function leaveRoom() {
  socket.disconnect();
  location.reload();
}

socket.on("chat-message", ({ username, message }) => {
  const div = document.createElement("div");
  div.className = "message " + (username === myUsername ? "me" : "other");
  div.innerHTML = `<b>${username}</b><br>${message}`;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView();
});

socket.on("system-message", ({ message }) => {
  const div = document.createElement("div");
  div.className = "system";
  div.innerText = message;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView();
});
</script>

</body>
</html>
